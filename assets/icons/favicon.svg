  <rect x="40" y="55" width="20" height="35" rx="2" fill="#ffffff"/>
  <!-- Window left -->
  <rect x="20" y="50" width="15" height="15" rx="2" fill="#ffffff"/>
  <!-- Window right -->
  <rect x="65" y="50" width="15" height="15" rx="2" fill="#ffffff"/>
  <!-- Heart in center (family love) -->
  <path d="M50 40 C45 35, 38 38, 38 43 C38 50, 50 55, 50 55 C50 55, 62 50, 62 43 C62 38, 55 35, 50 40" fill="#ef4444"/>
